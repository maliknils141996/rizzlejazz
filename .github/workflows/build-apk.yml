name: Build PayVox Smart Soundbox & Khata APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release PayVox APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Build APK with Gradle
      run: |
        if ! gradle assembleDebug --stacktrace --no-daemon > build.log 2>&1; then
          tail -n 80 build.log
          ERR_MSG=$(tail -n 20 build.log | tr '\n' ' ')
          echo "::error title=GradleBuildFailure::$ERR_MSG"
          exit 1
        fi
        tail -n 20 build.log
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Prepare Release Output
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/PayVox.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PayVox-APK
        path: release-output/PayVox.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v3.3.0-${{ github.run_number }}
        name: PayVox v3.3.0 - Exactly-Once Announcement & All Banks & Wallets UI
        body: |
          ### 💜 PayVox v3.3.0 Production Release

          ✅ **Key Upgrades in this Release:**
          - 🎯 **Exactly-Once Voice Announcement**: Suppressed the dual-trigger between Telephony SMS and Notification tray. Every payment (JazzCash send, Meezan receive) now announces strictly ONE time. No repetition!
          - 📱 **Clean "All Banks & Wallets" UI**: Removed the cluttered "Account / Bank:" prefix label above the dropdown. Dropdown now cleanly reads "All Banks & Wallets".
          - 🔄 **Smart Inter-Account Self-Transfer**: Seamlessly balances JazzCash Outflow (- Rs. 1) and Meezan Inflow (+ Rs. 1) with exact 1-time voice:
            - *"JazzCash se 1 rupay send ho gaye hain"*
            - *"Meezan Bank par 1 rupay receive ho gaye hain"*
          - 👑 **Universal Master Testing License**: `PV-MASTER-2026-VIP` (10-Year VIP Active)

          **Direct Download:** Click `PayVox.apk` below to download and install.
        draft: false
        prerelease: false
        files: release-output/PayVox.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
