name: Build PayVox Smart Soundbox & Khata APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release PayVox APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Prepare Release Output
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/PayVox.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PayVox-APK
        path: release-output/PayVox.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.3.0-${{ github.run_number }}
        name: PayVox v2.3 - Fixed Channel Audio & Sophisticated UI
        body: |
          ### 💜 PayVox v2.3 - Final Production Build

          ✅ **Key Fixes:**
          - 🎯 **Fixed False Trigger & Double Announcement:** Strict 8558/3737 shortcode verification and outbound notification suppression. JazzCash speaks strictly on JazzCash payment; Easypaisa speaks strictly on Easypaisa payment.
          - 📒 **Dual Khata System:** JazzCash Khata and Easypaisa Khata are completely segregated with independent Net Balances.
          - 📅 **Sophisticated Segmented Filter:** Compact, responsive `Today` | `Yesterday` | `This Month` | `📅 Custom` date picker that fits on all phone screens without cutting off.
          - 🎨 **Executive Bright White UI:** Clean off-white background, luxury royal purple balance card, and crisp typography.
          
          **Direct Download:** Click `PayVox.apk` below to download and install.
        draft: false
        prerelease: false
        files: release-output/PayVox.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
