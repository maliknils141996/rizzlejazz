name: Build PayVox Smart Soundbox & Khata APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release PayVox APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Build APK with Gradle
      run: |
        if ! gradle assembleDebug --stacktrace --no-daemon > build.log 2>&1; then
          tail -n 80 build.log
          ERR_MSG=$(tail -n 20 build.log | tr '\n' ' ')
          echo "::error title=GradleBuildFailure::$ERR_MSG"
          exit 1
        fi
        tail -n 20 build.log
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Prepare Release Output
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/PayVox.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PayVox-APK
        path: release-output/PayVox.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v3.2.0-${{ github.run_number }}
        name: PayVox v3.2.0 - Zero-Duplicate Fingerprint Dedup & Smart Self-Transfer Balancing
        body: |
          ### 💜 PayVox v3.2.0 Production Release

          ✅ **Key Upgrades in this Release:**
          - 🚫 **100% Zero-Duplicate Fingerprint Deduplication**: Fixed the bug where messages without a TID (like Meezan 1 PKR alert) bypassed deduplication and announced/inserted twice. Every message is now fingerprint-deduplicated across SMS and Notification tray. Zero double entries!
          - 🔄 **Smart Inter-Account Self-Transfer Balancing**: When money is moved from your own JazzCash to your Meezan Bank and JazzCash does not send an SMS, PayVox detects the transfer from the Meezan alert (`from NAVEED IQBAL JAZZCASH`), automatically records the JazzCash Outflow (- Rs. 1) and Meezan Inflow (+ Rs. 1), and announces both:
            - *"JazzCash se 1 rupay send ho gaye hain"*
            - *"Meezan Bank par 1 rupay receive ho gaye hain"*
          - 👑 **Universal Master Testing License**: `PV-MASTER-2026-VIP` (10-Year VIP Active)

          **Direct Download:** Click `PayVox.apk` below to download and install.
        draft: false
        prerelease: false
        files: release-output/PayVox.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
