name: Build PayVox Smart Soundbox & Khata APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release PayVox APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Prepare Release Output
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/PayVox.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PayVox-APK
        path: release-output/PayVox.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.4.0-${{ github.run_number }}
        name: PayVox v2.4 - Full Raast & App Notification Soundbox (Wi-Fi & SIM-less)
        body: |
          ### 💜 PayVox v2.4 - Wi-Fi & SIM-less Soundbox + Raast Support

          ✅ **Key Upgrades:**
          - 📡 **Works Without SIM (Wi-Fi Mode):** Full real-time incoming payment detection directly from JazzCash & Easypaisa push notifications (e.g. Raast incoming payments).
          - ⚡ **Raast Payment Voice & Ledger:** Detects `Rs [amount] received from [Sender] AC ... via Raast`, speaks sender amount out loud, and logs sender name cleanly to the Khata.
          - 🛡️ **Intelligent Deduplication:** When both SMS and App Push Notification arrive for the same payment, PayVox announces ONLY ONCE and prevents duplicate ledger entries.
          - 🔇 **Outbound & Bonus Filter:** Mutes cashbacks, rewards, and outbound transfer notifications. Only real incoming customer money speaks.
          - 🎯 **Dual Khata System:** Independent balance tracking for JazzCash & Easypaisa.

          **Direct Download:** Click `PayVox.apk` below to download and install.
        draft: false
        prerelease: false
        files: release-output/PayVox.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
