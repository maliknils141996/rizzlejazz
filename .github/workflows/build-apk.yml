name: Build PayVox Smart Soundbox & Khata APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release PayVox APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Build APK with Gradle
      run: |
        if ! gradle assembleDebug --stacktrace --no-daemon > build.log 2>&1; then
          tail -n 80 build.log
          ERR_MSG=$(tail -n 20 build.log | tr '\n' ' ')
          echo "::error title=GradleBuildFailure::$ERR_MSG"
          exit 1
        fi
        tail -n 20 build.log
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Prepare Release Output
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/PayVox.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PayVox-APK
        path: release-output/PayVox.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v3.4.0-${{ github.run_number }}
        name: PayVox v3.4.0 - All Official Bank & Wallet Logos & PDF Transaction Statement Export
        body: |
          ### 💜 PayVox v3.4.0 Production Release

          ✅ **Key Upgrades in this Release:**
          - 🏦 **Authentic Official Bank & Wallet Logos**: Added high-definition branded logos for all 19 Pakistani banks and digital wallets:
            - Faysal Bank (فیصل بینک)
            - JS Bank (جے ایس بینک)
            - Soneri Bank (سنہری بینک)
            - SadaPay (سادہ پے)
            - NayaPay (نیا پے)
            - BankIslami (بینک اسلامی)
            - Al Baraka Bank (البرکہ)
            - Dubai Islamic Bank / DIB (دبئی اسلامی بینک)
            - Standard Chartered (سٹینڈرڈ چارٹرڈ)
            - Along with JazzCash, Easypaisa, Meezan, Alfalah, HBL, UBL, NBP, Allied, Bank AL Habib, MCB, BOP, and Askari.
            - Brand logos also display directly inside each transaction feed card!
          - 📄 **Native PDF Transaction Statement Export**:
            - Added convenient `[ 📥 Download PDF ]` buttons in the Summary Hero Card and the Live Transactions Feed header.
            - Generates an official, beautifully formatted A4 multi-page PDF transaction statement for any filtered period (Today, Yesterday, This Month, or Custom Date) and selected bank/wallet.
            - Includes Executive Financial Summary (Total Received, Total Sent, Net Balance, and Counts) followed by detailed transaction ledger with TID, Date/Time, and Amount.
            - Integrated with Android FileProvider for 1-tap open, view, print, or share via WhatsApp/Email.
          - 👑 **Universal Master Testing License**: `PV-MASTER-2026-VIP` (10-Year VIP Active)

          **Direct Download:** Click `PayVox.apk` below to download and install.
        draft: false
        prerelease: false
        files: release-output/PayVox.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
