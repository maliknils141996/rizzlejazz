name: Build PayVox Smart Soundbox & Khata APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release PayVox APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Prepare Release Output
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/PayVox.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PayVox-APK
        path: release-output/PayVox.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.5.3-${{ github.run_number }}
        name: PayVox v2.5.3 - Direct Notification Access Recovery & Test Voice Button
        body: |
          ### 💜 PayVox v2.5.3 - Notification Access & Instant Voice Test

          ✅ **Key Upgrades:**
          - 🔔 **Notification Access Recovery (No-SIM / Wi-Fi Support):** Fixed issue where devices without SIM stopped announcing because Notification Access was unbound. Now automatically requests rebind and provides a 1-click settings button if not yet enabled!
          - 📢 **Instant "Test Voice" Button:** Added a prominent green `[📢 Test Voice]` button on the top-right so merchants can tap and test their speaker & soundbox voice anytime.
          - ⚡ **Dual Smart Permissions:** Auto-detects whether device needs SMS permission (on-screen Allow popup) or Notification Access (direct settings shortcut).

          **Direct Download:** Click `PayVox.apk` below to download and install.
        draft: false
        prerelease: false
        files: release-output/PayVox.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
