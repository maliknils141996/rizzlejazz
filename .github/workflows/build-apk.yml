name: Build PayVox Smart Soundbox & Khata APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release PayVox APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Prepare Release Output
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/PayVox.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PayVox-APK
        path: release-output/PayVox.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.5.2-${{ github.run_number }}
        name: PayVox v2.5.2 - 1-Click In-App Permission Dialogs
        body: |
          ### 💜 PayVox v2.5.2 - Instant On-Screen Permission Allow

          ✅ **Key Upgrades:**
          - ⚡ **1-Click On-Screen "Allow" Dialogs:** No need to ever open phone settings! PayVox directly triggers the native on-screen Android "Allow / Don't Allow" popups for SMS & Sound permissions.
          - 📱 **Interactive In-App Button:** Added a prominent `[⚡ Allow Permissions (الاؤ کریں)]` button inside the app that pops up the permission dialog instantly on tap.
          - 🚫 **Zero Settings Needed for Offline Mode:** Offline SMS soundbox works immediately once Allowed on screen; no deep phone settings navigation required!
          - 🎨 **Cleaner Merchant Interface:** Clean badges for JazzCash and Easypaisa.

          **Direct Download:** Click `PayVox.apk` below to download and install.
        draft: false
        prerelease: false
        files: release-output/PayVox.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
