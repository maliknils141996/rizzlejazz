name: Build PayVox Smart Soundbox & Khata APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release PayVox APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Prepare Release Output
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/PayVox.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PayVox-APK
        path: release-output/PayVox.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.5.0-${{ github.run_number }}
        name: PayVox v2.5 - Inflow & Outflow Voice Soundbox & Automatic Net Khata
        body: |
          ### 💜 PayVox v2.5 - Full Inflow & Outflow Voice Soundbox

          ✅ **Key Upgrades:**
          - 💸 **Outgoing Payments (Outflow) Detection:** Whenever you send money from JazzCash or Easypaisa (e.g. paying suppliers, bills, or transfers), PayVox detects it and subtracts it from your ledger in real-time.
          - 🗣️ **Outflow Urdu Voice Announcement:** Speaks out loud: *"JazzCash se [amount] rupay send ho gaye hain"* or *"Easypaisa se [amount] rupay send ho gaye hain"*.
          - ⚖️ **Accurate Net Balance:** Keeps track of Total Inflow, Total Outflow, and Daily Net Profit/Balance (`Inflow - Outflow`).
          - 📡 **Dual SMS & App Support:** Catches both official SMS (8558/3737) and app push notifications.
          - 🛡️ **Zero Duplicate Alerts:** Intelligent 25-second deduplication prevents multiple announcements for the same transaction.

          **Direct Download:** Click `PayVox.apk` below to download and install.
        draft: false
        prerelease: false
        files: release-output/PayVox.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
