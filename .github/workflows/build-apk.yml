name: Build PayVox Smart Soundbox & Khata APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release PayVox APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Build APK with Gradle
      run: |
        if ! gradle assembleDebug --stacktrace --no-daemon > build.log 2>&1; then
          tail -n 80 build.log
          ERR_MSG=$(tail -n 20 build.log | tr '\n' ' ')
          echo "::error title=GradleBuildFailure::$ERR_MSG"
          exit 1
        fi
        tail -n 20 build.log
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Prepare Release Output
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/PayVox.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PayVox-APK
        path: release-output/PayVox.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.9.0-${{ github.run_number }}
        name: PayVox v2.9.0 - True Outflow/Inflow Precision, Real Bank Icons & Multi-Bank Routing
        body: |
          ### 💜 PayVox v2.9.0 Production Release

          ✅ **Key Upgrades in this Release:**
          - 📤 **100% Outflow vs Inflow Precision**: Full resolution of Sent vs Received. Sending from JazzCash now unmistakably speaks *"JazzCash se [amount] rupay send ho gaye hain"*, and incoming speaks *"par [amount] rupay receive ho gaye hain"*.
          - 🏦 **Meezan Bank (8079 / 8078 / 9060) Active**: Added Meezan Bank's official transaction alert shortcodes so incoming & outgoing payments via Raast & IBFT are instantly recognized, spoken, and saved.
          - 🎨 **Real Original Bank Icons**: Replaced emoji dots and stars with real branded bank icon badges in the bank selector dropdown. Removed the star completely.
          - 🛡️ **Non-Blocking Soundbox Voice**: Voice announcements never fail or get muted even across dual-party transactions with shared Raast Reference IDs.
          - 👑 **Universal Master Testing License**: `PV-MASTER-2026-VIP` (10-Year VIP Active)

          **Direct Download:** Click `PayVox.apk` below to download and install.
        draft: false
        prerelease: false
        files: release-output/PayVox.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
