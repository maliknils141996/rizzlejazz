name: Build PayVox Smart Soundbox & Khata APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release PayVox APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Prepare Release Output
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/PayVox.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PayVox-APK
        path: release-output/PayVox.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.2.0-${{ github.run_number }}
        name: PayVox v2.2 - Smart Soundbox & Dual Khata
        body: |
          ### 💜 PayVox v2.2 - Dual Soundbox & Khata (Bright White & Purple UI)

          ✅ **Key Fixes & Features:**
          - 🎯 **Fixed Single-Channel Audio Speech:** JazzCash (8558) speaks strictly JazzCash; Easypaisa (3737) speaks strictly Easypaisa. Zero cross-talk or double announcement.
          - 📒 **Two Separate Ledgers (Dual Khata):** Dedicated JazzCash Khata Card + Dedicated Easypaisa Khata Card + Total Combined Net Balance!
          - 📅 **Interactive Calendar Date Picker:** Pick any custom date on the calendar to view its transactions.
          - 🎨 **Bright White & Royal Purple UI:** Clean off-white background with modern royal purple cards and high contrast typography.
          - 🛡️ **Anti-Spam Filter & Deduplication:** Till QR cashback/bonus spam is blocked.
          
          **Direct Download:** Click `PayVox.apk` below to download and install.
        draft: false
        prerelease: false
        files: release-output/PayVox.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
