name: Build PayVox Smart Soundbox & Khata APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release PayVox APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Build APK with Gradle
      run: |
        if ! gradle assembleDebug --stacktrace --no-daemon > build.log 2>&1; then
          tail -n 80 build.log
          ERR_MSG=$(tail -n 20 build.log | tr '\n' ' ')
          echo "::error title=GradleBuildFailure::$ERR_MSG"
          exit 1
        fi
        tail -n 20 build.log
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Prepare Release Output
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/PayVox.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PayVox-APK
        path: release-output/PayVox.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.8.0-${{ github.run_number }}
        name: PayVox v2.8.0 - Outflow vs Inflow Fix, All English Bank UI & Active Bank Engine
        body: |
          ### 💜 PayVox v2.8.0 Production Release

          ✅ **Key Upgrades in this Release:**
          - 📤 **Fixed JazzCash Outflow (Sent) Announcements:** Sent payments now properly announce *"se [amount] rupay send ho gaye hain"* instead of *"receive hue hain"*.
          - 🏦 **All-English Bank Dropdown UI:** Removed all Urdu in parentheses from the bank selector for clean readability.
          - ⚡ **Active Meezan & Pakistani Banks Engine:** Fixed sender priority & debit parsing so Meezan Bank and other bank transactions (send and receive) are immediately detected, announced, and recorded in Khata.
          - 👑 **Universal Master Testing License:** `PV-MASTER-2026-VIP`

          **Direct Download:** Click `PayVox.apk` below to download and install.
        draft: false
        prerelease: false
        files: release-output/PayVox.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
