name: Build PayVox Smart Soundbox & Khata APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release PayVox APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Build APK with Gradle
      run: |
        if ! gradle assembleDebug --stacktrace --no-daemon > build.log 2>&1; then
          tail -n 80 build.log
          ERR_MSG=$(tail -n 20 build.log | tr '\n' ' ')
          echo "::error title=GradleBuildFailure::$ERR_MSG"
          exit 1
        fi
        tail -n 20 build.log
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Prepare Release Output
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/PayVox.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PayVox-APK
        path: release-output/PayVox.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.6.1-${{ github.run_number }}
        name: PayVox v2.6.1 - Super Loud High-Pitch Soundbox & Clean Merchant UI
        body: |
          ### 💜 PayVox v2.6.1 - Super Loud Soundbox Upgrade

          ✅ **Key Upgrades:**
          - 🔊 **Extreme Loudness & High-Pitch Soundbox:** Switched audio routing from quiet system sonification to full Media loudspeaker stream (`USAGE_MEDIA` on `STREAM_MUSIC`) and boosted pitch to `1.20f` so the feminine voice penetrates loudly and crisply over shop/bazaar background noise. Auto-boosts phone hardware media, alarm, and notification volumes to 100% on every alert!
          - 🎨 **Removed In-App Volume Slider:** Cleaned up UI per user request, keeping default volume permanently locked at 100% maximum.
          - 🔍 **Real-Time Transaction Search Box:** Type any amount (e.g. "60"), TID, or name to instantly filter transactions in real time.
          - 💸 **Accurate Outflow (Sent) Announcements:** Correctly announces *"JazzCash se [amount] rupay send ho gaye hain"* and subtracts from Net Khata.
          - 👑 **Universal Master VIP Key:** `PV-MASTER-2026-VIP` for instant 10-year activation.

          **Direct Download:** Click `PayVox.apk` below to download and install.
        draft: false
        prerelease: false
        files: release-output/PayVox.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
