name: Build PayVox Smart Soundbox & Khata APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release PayVox APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Build APK with Gradle
      run: |
        if ! gradle assembleDebug --stacktrace --no-daemon > build.log 2>&1; then
          tail -n 80 build.log
          ERR_MSG=$(tail -n 20 build.log | tr '\n' ' ')
          echo "::error title=GradleBuildFailure::$ERR_MSG"
          exit 1
        fi
        tail -n 20 build.log
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Prepare Release Output
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/PayVox.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PayVox-APK
        path: release-output/PayVox.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.7.0-${{ github.run_number }}
        name: PayVox v2.7.0 - Zero Missed Payments, All Pakistan Banks & Bank Filter Dropdown
        body: |
          ### 💜 PayVox v2.7.0 - Major Pakistani Banks & Zero-Missed Payments Upgrade

          ✅ **Key Upgrades in this Release:**
          - 🛡️ **Zero Missed Payments Engine:** Completely eliminated payment drops. Refined spam filter so JazzCash & Easypaisa SMS mentioning reward/loyalty points are never discarded; resolved empty TID SQLite collisions; and allowed rapid back-to-back payments.
          - 🏦 **All Pakistan Banks & Wallets:** Added full support for Pakistani commercial and Islamic banks: Meezan Bank, Bank Alfalah, HBL, UBL, MCB, Allied Bank (ABL), Faysal Bank, Askari Bank, Bank of Punjab (BOP), JS Bank, Soneri Bank, SadaPay, NayaPay, BankIslami, Al Baraka, Dubai Islamic (DIB), Standard Chartered, and Raast!
          - 📢 **Instant Spoken Bank Announcements:** Distinct voice announcements for each bank (e.g. *"Meezan Bank par 5000 rupay receive ho gaye hain"*, *"Bank Alfalah par 2500 rupay receive ho gaye hain"*, etc.).
          - 🔽 **Bank Filter Dropdown (ڈراپ ڈاؤن مینو):** A dedicated dropdown menu allows merchants to inspect individual bank ledgers or combined totals with one tap.
          - 🎨 **Distinct Branded Bank Badges:** Live feed clearly highlights the origin bank in official brand colors.
          - 👑 **Universal Master Testing License:** Enter `PV-MASTER-2026-VIP` for instant 10-year VIP activation.

          **Direct Download:** Click `PayVox.apk` below to download and install.
        draft: false
        prerelease: false
        files: release-output/PayVox.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
