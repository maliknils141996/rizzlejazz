name: Build Rising Jazz Merchant APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Release Rising Jazz Merchant APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Prepare Release Output
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/Rising-Jazz-Merchant.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rising-Jazz-Merchant-APK
        path: release-output/Rising-Jazz-Merchant.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0-${{ github.run_number }}
        name: Rising Jazz Merchant v1.0.0
        body: |
          ### 🎉 Rising Jazz Merchant (رائزنگ جاز مرچنٹ) - Official APK

          ✅ **Features:**
          - 📢 **Soundbox Voice Announcement:** Automatically speaks aloud *"JazzCash par [amount] rupay receive ho gaye"* when payment arrives.
          - 🌐 **Instant Webhook Sync:** Silently sends transaction data to your Hostinger Web Admin Panel.
          - 🏪 Supports both **Shop Merchant Till/QR** and **Personal** accounts.
          
          **Direct Download:** Click `Rising-Jazz-Merchant.apk` below to install directly on your phone.
        draft: false
        prerelease: false
        files: release-output/Rising-Jazz-Merchant.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
