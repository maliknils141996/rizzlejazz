name: Build PayVox Smart Soundbox & Khata APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release PayVox APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Build APK with Gradle
      run: |
        if ! gradle assembleDebug --stacktrace --no-daemon > build.log 2>&1; then
          tail -n 80 build.log
          ERR_MSG=$(tail -n 20 build.log | tr '\n' ' ')
          echo "::error title=GradleBuildFailure::$ERR_MSG"
          exit 1
        fi
        tail -n 20 build.log
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Prepare Release Output
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/PayVox.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PayVox-APK
        path: release-output/PayVox.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v3.0.0-${{ github.run_number }}
        name: PayVox v3.0.0 - Authentic Bank Logos, Exact Bank Name Tagging & Dual-Redundancy Capture
        body: |
          ### 💜 PayVox v3.0.0 Production Release

          ✅ **Key Upgrades in this Release:**
          - 🏦 **Authentic Bank Logos From Official Spec Sheet**: Extracted 10 high-resolution authentic Pakistani bank symbols (UBL, HBL, NBP, Meezan Bank, Bank Alfalah, Allied Bank, Bank AL Habib, MCB Bank, Bank of Punjab, Askari Bank) directly used in app dropdown and badges.
          - 🏷️ **Exact Bank Name Tagging (Never Generic "BANK")**: Transaction cards now explicitly display the destination bank name (e.g. `MEEZAN BANK`, `UBL`, `HBL BANK`, `BANK ALFALAH`) instead of generic `BANK`.
          - ⚡ **Dual-Redundancy SMS & Notification Capture**: Notification listener no longer ignores messaging apps (Google Messages, Samsung Messages). Even if OEM battery optimization delays `SMS_RECEIVED` broadcast, notifications instantly capture JazzCash & bank sent/received payments without drops.
          - 📤 **100% Outflow vs Inflow Voice Precision**: Outgoing payments are clearly announced as *"JazzCash se [amount] rupay send ho gaye hain"*, while incoming announce *"par [amount] rupay receive ho gaye hain"*.
          - 👑 **Universal Master Testing License**: `PV-MASTER-2026-VIP` (10-Year VIP Active)

          **Direct Download:** Click `PayVox.apk` below to download and install.
        draft: false
        prerelease: false
        files: release-output/PayVox.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
