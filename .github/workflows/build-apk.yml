name: Build PayVox Smart Soundbox & Khata APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release PayVox APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Build APK with Gradle
      run: |
        if ! gradle assembleDebug --stacktrace --no-daemon > build.log 2>&1; then
          tail -n 80 build.log
          ERR_MSG=$(tail -n 20 build.log | tr '\n' ' ')
          echo "::error title=GradleBuildFailure::$ERR_MSG"
          exit 1
        fi
        tail -n 20 build.log
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Prepare Release Output
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/PayVox.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PayVox-APK
        path: release-output/PayVox.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v3.1.0-${{ github.run_number }}
        name: PayVox v3.1.0 - Total Channel Isolation & Raast Inter-Bank Routing Fix
        body: |
          ### 💜 PayVox v3.1.0 Production Release

          ✅ **Key Upgrades in this Release:**
          - 🎯 **Fixed Inter-Bank Raast Attribution Bug**: Prevented bank received SMS (e.g. from Meezan 8079) mentioning "via Raast from JAZZCASH" from falsely overriding the channel to JazzCash. Meezan alerts will ALWAYS announce as Meezan Bank.
          - 📤 **Clean Outflow Separation**: Outgoing payments from JazzCash to Meezan Bank now explicitly state *"JazzCash se [amount] rupay send ho gaye hain"*, and incoming credits state *"Meezan Bank par [amount] rupay receive ho gaye hain"*.
          - 📢 **Non-Conflicting Audio Queue**: Replaced TTS QUEUE_FLUSH with QUEUE_ADD so sequential dual-alerts (Debit + Credit) speak completely without cancelling each other.
          - 🏦 **Authentic Bank Logos**: 10 official Pakistani bank icons cropped from specification sheet.
          - 👑 **Universal Master Testing License**: `PV-MASTER-2026-VIP` (10-Year VIP Active)

          **Direct Download:** Click `PayVox.apk` below to download and install.
        draft: false
        prerelease: false
        files: release-output/PayVox.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
