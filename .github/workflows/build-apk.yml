name: Build Rizzle Merchant Soundbox & Khata APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Rizzle Merchant APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Prepare Release Output
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/Rizzle-Merchant-Soundbox.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rizzle-Merchant-Soundbox-APK
        path: release-output/Rizzle-Merchant-Soundbox.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.0-${{ github.run_number }}
        name: Rizzle Merchant Soundbox & Khata v2.0
        body: |
          ### 🎉 Rizzle Merchant - Offline Soundbox & Shop Khata APK

          ✅ **Key Features:**
          - 📢 **Dual Voice Soundbox:** Real-time Urdu voice announcements for **JazzCash** (`8558`) and **Easypaisa** (`3737`).
          - 🔐 **Device-Locked Cryptographic Licensing:** Offline HMAC-SHA256 license security (1-Day Trial, Monthly, Yearly).
          - 📒 **100% Offline SQLite Khata:** Built-in Shop Ledger tracking Net Balance (`Inflow - Outflow`).
          - 💸 **Cash Out / Withdrawal Management:** Record money transferred out with user notes, recipients, and purpose.
          - ➕ **Cash In Counter Sale:** Record walk-in counter sales.
          - 💬 **WhatsApp Khata Sharing:** 1-Click shareable daily/monthly ledger summaries.
          - 🚫 **Anti-Cheating Protection:** Instant remote blacklist deactivation for lost/stolen phones.
          
          **Direct Download:** Click `Rizzle-Merchant-Soundbox.apk` below to download and install.
        draft: false
        prerelease: false
        files: release-output/Rizzle-Merchant-Soundbox.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
