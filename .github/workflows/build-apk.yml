name: Build PayVox Smart Soundbox & Khata APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release PayVox APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace --no-daemon
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Prepare Release Output
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/PayVox.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PayVox-APK
        path: release-output/PayVox.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.6.0-${{ github.run_number }}
        name: PayVox v2.6.0 - Merchant Outflow Fix, Soundbox Volume Slider & Search
        body: |
          ### 💜 PayVox v2.6.0 - Major Merchant Upgrade

          ✅ **Key Upgrades:**
          - 💸 **Accurate Outflow (Sent) Announcements:** Fixed issue where outbound bank transfers (e.g. *"Rs 9,177.00 sent to RIZZLE PHARMACY... will be credited within 30 minutes"*) were mistakenly announced as received. Now strictly announces: *"JazzCash se 9177 rupay send ho gaye hain"* and accurately subtracts it from the Net Khata!
          - 🔊 **Soundbox Extra Loudness & In-App Volume Control:** Added a sleek in-app volume slider (0% to 100%). Pushes hardware speaker to maximum 100% Full Boost by default so you can hear announcements across the market.
          - 🔍 **Real-Time Transaction Search Box:** Added a quick search bar above the live transactions feed. Type any amount (e.g. "60"), TID, or name to instantly filter transactions in real time!
          - 👑 **Universal Master Testing License:** Enter `PV-MASTER-2026-VIP` on ANY device for instant 10-year VIP testing access.

          **Direct Download:** Click `PayVox.apk` below to download and install.
        draft: false
        prerelease: false
        files: release-output/PayVox.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
